name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Pull requests deliberately do not deploy. The previous "Deploy preview
      # Worker" step ran `deploy --env preview` and silently shipped every PR to
      # production: the Astro Cloudflare adapter emits dist/server/wrangler.json
      # flattened, with no `env` block, and wrangler redirects to that file via
      # .wrangler/deploy/config.json — so `--env preview` had nothing to select
      # and fell through to the top-level Worker, without a warning. Lint and
      # build are the PR gate; deploys happen on master only.
      - name: Deploy to production
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --name medcalc
