name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

  # Lets the migration check be run on demand — to prove it works before it
  # ever gates a deploy, and to re-verify after a manual `db push` without
  # re-running a whole merge.
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx astro sync
      - run: npm run lint
      # `astro build` does NOT run `astro check` -- they are separate commands,
      # and the build's transform step type-checks neither `.astro` frontmatter
      # nor the islands. Without this step a type regression reaches production.
      # `astro sync` above generates `.astro/types.d.ts`, which `astro check`
      # needs. Baseline on master is 0 errors / 5 pre-existing ts(6387) hints in
      # eslint.config.js; `astro check` exits non-zero on errors only, so the
      # hints do not block -- do not "fix" them to quieten this step.
      - run: npm run typecheck
      - run: npm run build
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      # Blocks the deploy when a migration is merged but never applied to cloud.
      # Ordered ahead of the deploy deliberately: shipping code that assumes a
      # policy or column the live database does not have is exactly how the
      # same-day dosage edit returned a 500 for eight days. This does not apply
      # anything — `db push` stays the manual step F-01 chose. Re-run the
      # workflow after pushing to clear it.
      - name: Check migrations are applied to cloud
        if: github.event_name != 'pull_request'
        run: node scripts/check-migration-drift.mjs
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # Not a secret: the ref is already committed in this public repo, in
          # context/changes/domain-schema-foundation/change.md
          SUPABASE_PROJECT_REF: nkqbiphgoemmehflgogz
      # Pull requests deliberately do not deploy. The previous "Deploy preview
      # Worker" step ran `deploy --env preview` and silently shipped every PR to
      # production: the Astro Cloudflare adapter emits dist/server/wrangler.json
      # flattened, with no `env` block, and wrangler redirects to that file via
      # .wrangler/deploy/config.json — so `--env preview` had nothing to select
      # and fell through to the top-level Worker, without a warning. Lint, type
      # check and build are the PR gate; deploys happen on master only.
      - name: Deploy to production
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --name medcalc
